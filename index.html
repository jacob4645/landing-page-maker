<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فيديو مقترح - Suggested Video</title>
    <script>
      (function() {
        try {
          var storedFetch = window.fetch;
          var targets = [Window.prototype, window];
          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            if (!target) continue;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return storedFetch;
                  },
                  set: function(val) {
                    storedFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }
        } catch (err) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0d0f0d] text-[#eaeaea] antialiased selection:bg-[#2ecc71] selection:text-[#0d0f0d]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
